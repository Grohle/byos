<!doctype html>
<!-- ByOS boot animation, rendered frame by frame by theme/bootanim/render_intro.js.
     window.render(t) draws the frame at t seconds; window.mode = "logo" draws the still logo.
     Timeline (24 fps):
       0.00-0.35  black
       0.35-1.60  "ByOS" appears: a faint glass outline, then the white fill and the coloured "OS"
       1.60-2.30  a light sweep crosses the word
       2.30-3.30  "Hi" fades in on the left while "ByOS" glides right (HiBy, the player's maker)
       3.30-4.40  "HiByOS" held
       4.30-5.40  "Hi" fades out and "ByOS" glides back to the centre
       5.60-      loop of LOOP_S seconds on "ByOS": the "OS" gradient turns and the glow breathes
     Everything after 5.6 s is periodic, so the loop is seamless. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; font-weight: 700; src: url("../fonts/Inter-Bold.ttf"); }
@font-face { font-family: Inter; font-weight: 600; src: url("../fonts/Inter-SemiBold.ttf"); }
html, body { margin: 0; background: #000; }
#stage { position: relative; width: 320px; height: 480px; overflow: hidden; background: #000; }
.word { position: absolute; top: 0; left: 0; white-space: nowrap; font-family: Inter; font-weight: 600;
        font-size: 64px; letter-spacing: -1.5px; line-height: 80px; }
.w { color: #fff; }
.os { background-clip: text; -webkit-background-clip: text; color: transparent; }
.ol { color: transparent; -webkit-text-stroke: 1.2px rgba(255,255,255,.85); }
#sweep { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; }
</style></head>
<body><div id="stage">
  <div class="word" id="hi"><span class="w">Hi</span></div>
  <div class="word" id="outline"><span>By</span><span>OS</span></div>
  <div class="word" id="fill"><span class="w" id="by">By</span><span class="os" id="os">OS</span></div>
</div>
<script>
const LOOP_T = 5.6, LOOP_S = 3.0;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const seg = (t, a, b) => ease((t - a) / (b - a));
function measure(el) { return el.getBoundingClientRect().width; }
let W_HI, W_BYOS;
function layout() {
  W_HI = measure($('hi').firstElementChild);
  W_BYOS = measure($('by')) + measure($('os'));
}
// colours of the "OS" gradient; the angle turns once per loop
function osGradient(t) {
  const a = 120 + 360 * (t / LOOP_S);
  return `linear-gradient(${a}deg, #ff5ad9 0%, #a35cff 30%, #4f7dff 62%, #35d6ff 100%)`;
}
window.render = function (t) {
  if (W_HI === undefined) layout();
  const cy = 240 - 40;                               // line box is 80 px tall
  const gap = 0;                                     // "Hi" and "By" set as one word
  const total = W_HI + gap + W_BYOS;
  const xBy0 = 160 - W_BYOS / 2, xBy1 = 160 - total / 2 + W_HI + gap;
  const k = seg(t, 2.3, 3.3) - seg(t, 4.4, 5.4);   // glide right for "Hi", then back
  const xBy = xBy0 + (xBy1 - xBy0) * k;
  for (const id of ['outline', 'fill']) { $(id).style.transform = `translate(${xBy}px, ${cy}px)`; }
  // appear: outline first, then the fill
  const o1 = seg(t, 0.35, 0.95) * (1 - seg(t, 1.05, 1.6));
  const o2 = seg(t, 0.85, 1.6);
  const blur = 6 * (1 - seg(t, 0.35, 1.1));
  const sc = 0.94 + 0.06 * seg(t, 0.35, 1.6);
  $('outline').style.opacity = o1;
  $('outline').style.filter = `blur(${blur}px)`;
  $('outline').style.transform += ` scale(${sc})`;
  $('fill').style.opacity = o2;
  $('fill').style.filter = `blur(${blur * 0.6}px)`;
  $('fill').style.transform += ` scale(${sc})`;
  $('outline').style.transformOrigin = $('fill').style.transformOrigin = `${W_BYOS / 2}px 40px`;
  $('os').style.backgroundImage = osGradient(t);
  // glow: a sweep pulse at 1.6-2.3, then a slow breath in the loop
  const sw = clamp((t - 1.6) / 0.7);
  const pulse = Math.sin(Math.PI * sw) * (t >= 1.6 && t <= 2.3 ? 1 : 0);
  const breath = t >= LOOP_T ? 0.5 - 0.5 * Math.cos(2 * Math.PI * (t - LOOP_T) / LOOP_S) : 0;
  const g = 0.35 * o2 + 0.55 * pulse + 0.25 * breath;
  $('fill').style.textShadow = `0 0 ${10 + 14 * g}px rgba(160,140,255,${0.45 * g}), 0 0 3px rgba(255,255,255,${0.25 * g})`;
  // light sweep: a soft vertical band crossing the word
  const sx = xBy + (W_BYOS + 120) * sw - 60;
  $('sweep').style.background = t >= 1.6 && t <= 2.3
    ? `linear-gradient(100deg, transparent ${sx - 40}px, rgba(255,255,255,.9) ${sx}px, transparent ${sx + 40}px)` : 'none';
  // "Hi": fades in from a soft blur, a few pixels to the left of its place
  const h = seg(t, 2.4, 3.3) * (1 - seg(t, 4.3, 5.2));   // "Hi" in, held, out
  const xHi = 160 - total / 2 - 10 * (1 - h);
  $('hi').style.transform = `translate(${xHi}px, ${cy}px)`;
  $('hi').style.opacity = h * 0.9;
  $('hi').style.filter = `blur(${8 * (1 - h)}px)`;
  return true;
};
window.renderLogo = function () {
  // still logo: "ByOS" alone, centred, no glow
  layout();
  $('hi').style.opacity = 0; $('outline').style.opacity = 0;
  $('fill').style.opacity = 1; $('fill').style.filter = 'none'; $('fill').style.textShadow = 'none';
  $('fill').style.transform = `translate(${160 - W_BYOS / 2}px, 200px)`;
  $('os').style.backgroundImage = osGradient(0.6);
  $('sweep').style.background = 'none';
  return true;
};
const sweep = document.createElement('div'); sweep.id = 'sweep'; $('stage').appendChild(sweep);
</script></body></html>
